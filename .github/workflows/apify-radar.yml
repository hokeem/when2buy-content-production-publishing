name: Apify benchmark radar

on:
  push:
    branches: [main]
    paths:
      - "scripts/collect_apify_benchmarks.py"
      - ".github/workflows/apify-radar.yml"
  workflow_dispatch:
  schedule:
    # 08:30, 14:30, 20:30 Asia/Shanghai (UTC+8).
    - cron: "30 0,6,12 * * *"

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/collect_apify_benchmarks.py
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
      - run: python3 scripts/archive_benchmark_media.py
      - run: python3 scripts/build_production_queue.py
      - run: python3 skills/when2buy-content-publisher/scripts/state.py validate
      - run: python3 scripts/render_report.py
      - run: python3 scripts/render_run_panel.py
      - run: python3 scripts/security_scan.py
      - name: Retain original benchmark media
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-media-${{ github.run_id }}
          path: output/benchmark-media/
          if-no-files-found: ignore
          retention-days: 30
      - name: Persist radar state
        run: |
          git config user.name "when2buy-radar[bot]"
          git config user.email "when2buy-radar[bot]@users.noreply.github.com"
          git add -- data/state.json data/production-queue.json reports/latest.md reports/run-panel.html
          git diff --cached --quiet || git commit -m "chore: refresh Apify benchmark radar"
          git push
